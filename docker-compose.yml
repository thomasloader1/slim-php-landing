services:
  landing:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    restart: unless-stopped
    environment:
      DB_HOST: phpmyadmin-mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-project_landing}
      DB_USER: ${DB_USER:-landing_user}
      DB_PASS: ${DB_PASS:-landing_pass}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      APP_ENV: ${APP_ENV:-development}
      MASTER_DOMAINS: ${MASTER_DOMAINS:-localhost}
      # Ruta que lista Admin → Directorios (por defecto, la carpeta public_html junto a la app)
      DIRECTORIES_ROOT: ${DIRECTORIES_ROOT:-/var/www}
      TENANT_ENCRYPTION_KEY: ${TENANT_ENCRYPTION_KEY:-}
      TENANT_ENCRYPTION_KEY_V2: ${TENANT_ENCRYPTION_KEY_V2:-}
      TENANT_ENCRYPTION_KEY_ACTIVE: ${TENANT_ENCRYPTION_KEY_ACTIVE:-v1}
    volumes:
      - ./landing:/var/www/html
    ports:
      - "8001:80"
    networks:
      - phpmyadmin_phpmyadminsql-network

networks:
  phpmyadmin_phpmyadminsql-network:
    external: true
volumes: {}